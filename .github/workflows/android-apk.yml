name: Build MasterCred evolux APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'MasterCredEvolux-Android-Projeto.zip'
      - '.github/workflows/android-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
- name: Set up Android SDK
  uses: android-actions/setup-android@v4
  with:
    packages: 'platform-tools'

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Unpack project
        run: |
          unzip MasterCredEvolux-Android-Projeto.zip
          test -d MasterCredEvolux

      - name: Build debug APK
        working-directory: MasterCredEvolux
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MasterCred-evolux-APK
          path: MasterCredEvolux/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
